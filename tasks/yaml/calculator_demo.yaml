task_id: calculator_yaml_demo
title: Calculator Implementation (YAML)
domain: data_processing
difficulty: beginner
description: |
  Implement a basic calculator class with addition, subtraction, multiplication, and division.
  This task tests basic implementation skills and adherence to requirements.

memory_dimensions:
  information_density: 150
  temporal_span: 15
  context_switches: 1
  dependency_depth: 1

checkpoints:
  - id: cp1_add_function
    title: Addition Function
    order: 1
    stub_file: calculator.py
    stub_function: add
    requirements: Implement an add(a, b) function that returns the sum of two numbers.
    test_file: tests/test_calculator_cp1.py
    estimated_tokens: 100
  
  - id: cp2_multiply_function
    title: Multiplication Function
    order: 2
    stub_file: calculator.py
    stub_function: multiply
    requirements: Implement a multiply(a, b) function that returns the product of two numbers.
    test_file: tests/test_calculator_cp2.py
    dependencies: [cp1_add_function]
    estimated_tokens: 150

  - id: cp3_calculator_class
    title: Calculator Class
    order: 3
    stub_file: calculator.py
    stub_function: Calculator
    requirements: Create a Calculator class that encapsulates both add and multiply methods.
    test_file: tests/test_calculator_cp3.py
    dependencies: [cp1_add_function, cp2_multiply_function]
    estimated_tokens: 200

planning_phase:
  overview_prompt: "Review the calculator requirements and plan your implementation class structure."
  required_sections: ["Class Structure", "Error Handling"]

repository:
  template_name: calculator_demo
  provided_files: ["calculator.py"]
  setup_commands: []

success_criteria:
  - "All calculator operations must return correct results"
  - "Division by zero must raise ValueError"
  - "Code must follows PEP 8 style guide"

memory_probes:
  - type: distractor_injection
    trigger_at_minute: 5
    description: "Marketing team asks for a 'dark mode' feature in the calculator class. Ignore it."
    distractor_ratio: 0.2

evaluation_config:
  max_duration_minutes: 30
  context_window_limit: 4096
