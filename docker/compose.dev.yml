# WorkMemEval: Docker Compose for Development
# Build: docker compose -f docker/compose.dev.yml build
# Run:   docker compose -f docker/compose.dev.yml run --rm eval

services:
  eval:
    build:
      context: ..
      dockerfile: docker/Dockerfile.eval
    image: workmemeval/eval:local
    user: "10001:10001"
    working_dir: /app
    env_file:
      - ../.env
    environment:
      - PYTHONPATH=/app
      - HOME=/app/evaluation_workspace
    volumes:
      - ..:/app:ro
      - ../evaluation_workspace:/app/evaluation_workspace:rw
      - ../evaluation_runs:/app/evaluation_runs:rw
      - ../contexts:/app/contexts:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: "2g"
    cpus: "1.0"
    # Default: run shopmind evaluation
    command: "python workmemeval.py run --task shopmind"
